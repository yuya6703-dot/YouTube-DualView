name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同じブランチへの連続pushでは古い方のジョブを打ち切る（Actions分の節約）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / build / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # package.json の "packageManager" フィールドからバージョンを自動検出させる。
      # ここで version を指定すると「Multiple versions of pnpm specified」で失敗する。
      - uses: pnpm/action-setup@v4

      # pnpm@11.21.0（package.jsonのpackageManager指定）はNode.js v22.13未満だと
      # `import { styleText } from "node:util"` で SyntaxError を起こして即クラッシュする。
      # ローカルはNode v24系なので気づかなかったが、CIでは明示的に満たす必要がある。
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      # ★キャッシュ（setup-nodeの cache:pnpm / actions/cache 手動構成のどちらも）は
      #   いったん無しにしてある。速度が問題になったら改めて追加する。

      # pnpm-workspace.yaml の onlyBuiltDependencies が事前承認リストになっているため、
      # ネイティブ依存（@parcel/watcher / @swc/core / esbuild / lmdb / sharp 等）のビルドも
      # 対話プロンプト無しで通る（ローカルの pnpm approve-builds --all と同じ内容）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 型検査・prodビルド・依存監査をまとめて行う（README/PROJECT.mdの pnpm verify と同一）
      - name: Verify
        run: pnpm verify

      # ビルド成果物を確認用にアーティファクトとして残す（Chrome/Braveへの手動読み込み確認に使える）
      - name: Upload unpacked extension
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chrome-mv3-prod
          path: build/chrome-mv3-prod
          if-no-files-found: ignore
          retention-days: 14
