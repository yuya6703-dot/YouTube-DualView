name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同じブランチへの連続pushでは古い方のジョブを打ち切る（Actions分の節約）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / build / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json の "packageManager" フィールドからバージョンを自動検出させる。
      # ここで version を指定すると「Multiple versions of pnpm specified」で失敗する。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
      # ★キャッシュ（setup-nodeの cache:pnpm / actions/cache 手動構成のどちらも）を
      #   このCI上で試したところ原因不明のまま失敗が続いたため、いったん無しで確実に
      #   グリーンにすることを優先した。速度が問題になったら改めて調査する。

      # pnpm-workspace.yaml の onlyBuiltDependencies が事前承認リストになっているため、
      # ネイティブ依存（@parcel/watcher / @swc/core / esbuild / lmdb / sharp 等）のビルドも
      # 対話プロンプト無しで通る（ローカルの pnpm approve-builds --all と同じ内容）。
      # ★診断用: 失敗の実出力をジョブサマリーに書き出す。
      #   Actionsのログ生ダウンロードAPIは未認証だと403になるため、
      #   check-runsのoutput.summaryから見える形で残す。原因特定でき次第この工夫は外す。
      - name: Install dependencies
        run: |
          set +e
          pnpm install --frozen-lockfile > /tmp/install.log 2>&1
          code=$?
          {
            echo "## pnpm install exit code: $code"
            echo '```'
            tail -c 6000 /tmp/install.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/install.log
          exit $code

      # 型検査・prodビルド・依存監査をまとめて行う（README/PROJECT.mdの pnpm verify と同一）
      - name: Verify
        run: pnpm verify

      # ビルド成果物を確認用にアーティファクトとして残す（Chrome/Braveへの手動読み込み確認に使える）
      - name: Upload unpacked extension
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3-prod
          path: build/chrome-mv3-prod
          if-no-files-found: ignore
          retention-days: 14
